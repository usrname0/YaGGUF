[pytest]
# Pytest configuration for YaGGUF

# Only look for tests in the tests/ directory
testpaths = tests

# Test file patterns
python_files = test_*.py

# Test class patterns
python_classes = Test*

# Test function patterns
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring real model downloads and significant disk space/time
    requires_binaries: marks tests that require llama.cpp binaries

# Ignore paths (avoid picking up llama.cpp tests)
norecursedirs =
    llama.cpp
    .git
    __pycache__
    *.egg-info
    build
    dist
    venv
    .venv

# Warning filters
# huggingface_hub (even latest, 1.18.0) still calls the deprecated
# hf_xet.download_files() internally, so this DeprecationWarning is upstream
# noise we can't fix here. Ignore just that message until hf-hub migrates.
filterwarnings =
    ignore:hf_xet.download_files\(\) is deprecated.*:DeprecationWarning

# Output options
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    -v
